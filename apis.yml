name: Congruent
description: >-
  Congruent builds AI-native radar hardware and simulation tooling for
  self-driving cars and end-to-end autonomy. The company pairs a radar
  architecture that exposes raw sensor data with a world-model-based generative
  simulator, producing both real and synthetic raw radar returns to train
  autonomy stacks. Radar is the only depth sensor cheap enough to scale to every
  vehicle while still working in rain, fog, snow, and dust, where camera and
  lidar systems degrade. Congruent is an early-stage Y Combinator (W26) company
  founded in 2025 by Clement Barthes and Evan Scope Crafts, based in the San
  Francisco Bay Area. It was surfaced as a Y Combinator portfolio company and
  added to the API Evangelist network for enrichment; as of this profile the
  company operates a single marketing website and publishes no public API,
  developer portal, SDK, or specification.
